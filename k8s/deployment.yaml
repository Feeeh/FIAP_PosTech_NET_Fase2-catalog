apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: fcg
  labels:
    app: catalog-api
    app.kubernetes.io/part-of: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
        app.kubernetes.io/part-of: fcg
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: catalog-api
          image: fcg/catalog-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: catalog-api-config
            - secretRef:
                name: catalog-api-secret
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            httpGet:
              path: /saude
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /saude
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /saude
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
